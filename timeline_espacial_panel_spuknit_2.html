<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploración espacial | Timeline</title>
<style>
:root {
  --bg: #080d1b;
  --panel: #111b30;
  --line: #42c9ee;
  --text: #f4f7ff;
  --muted: #a8bad5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 0%, #18345a 0%, transparent 55%),
    linear-gradient(145deg, #080d1b, #10172a 60%, #080d1b);
  font-family: Inter, Arial, sans-serif;
  min-height: 100vh;
}
header { padding: 28px 24px 18px; text-align: center; }
.eyebrow {
  color: #60d8f4; letter-spacing: 3px;
  text-transform: uppercase; font-size: 11px;
}
h1 { margin: 10px 0; font-size: clamp(26px, 4vw, 42px); }
.subtitle { color: var(--muted); margin: 0 auto; max-width: 680px; }
.controls {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: center; padding: 16px 20px;
}
input, select, button {
  background: #131f35; color: white;
  border: 1px solid #344966; border-radius: 9px;
  padding: 11px 13px; font-size: 14px;
}
input { width: min(300px, 90vw); }
button { cursor: pointer; }
button:hover { border-color: var(--line); }
.stats { text-align: center; color: var(--muted); font-size: 13px; }
.timeline-wrap {
  margin: 24px 0 0; overflow-x: auto; padding: 0 22px 22px;
  scrollbar-color: #315675 #0c1425;
}
.timeline {
  position: relative; display: flex; align-items: center;
  min-width: max-content; min-height: 430px; padding: 0 28px;
}
.timeline::before {
  content: ""; position: absolute; left: 0; right: 0;
  top: 50%; height: 4px; transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, #3bbfe8, #b4f3ff, #3bbfe8, transparent);
  box-shadow: 0 0 16px #25b9eb66;
}
.event {
  width: 250px; height: 440px; flex: 0 0 250px;
  position: relative;
}
.event .dot {
  position: absolute; top: calc(50% - 9px); left: 14px;
  width: 18px; height: 18px; border-radius: 50%;
  border: 4px solid #d7f8ff; background: #20b9e9;
  box-shadow: 0 0 13px #28c5f0;
  z-index: 2;
}
.card {
  position: absolute; left: 0; right: 10px;
  height: 180px; padding: 15px;
  background: linear-gradient(145deg, #192b45, #0c1424);
  border: 1px solid #36516c; border-top: 3px solid var(--accent);
  border-radius: 7px; overflow: hidden;
  box-shadow: 0 8px 22px #0005;
  transition: transform .2s ease, border-color .2s ease;
}
.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}
.event:nth-child(odd) .card { top: 4px; }
.event:nth-child(even) .card { bottom: 4px; }
.event:nth-child(odd) .card::after,
.event:nth-child(even) .card::after {
  content: ""; position: absolute; left: 22px; height: 30px;
  border-left: 1px dashed var(--accent);
}
.event:nth-child(odd) .card::after { bottom: -30px; }
.event:nth-child(even) .card::after { top: -30px; }
.year { color: var(--accent); font-size: 13px; font-weight: 700; }
.card h2 {
  font-size: 18px; margin: 8px 0; line-height: 1.3;
  overflow-wrap: anywhere;
}
.meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.tag {
  display: inline-block; font-size: 11px; padding: 4px 7px;
  border-radius: 20px; background: #253752; margin: 2px 2px 0 0;
}
.detail {
  color: #d6e1f2; font-size: 13px; line-height: 1.5;
  overflow-wrap: anywhere;
}
.result { font-size: 11px; margin-top: 8px; color: var(--accent); }
.navigation {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; padding: 10px 20px 24px;
}
#pageLabel { color: var(--muted); font-size: 13px; min-width: 115px; text-align: center; }
footer { text-align: center; padding: 15px; color: #7f93b0; font-size: 11px; }
@media (max-width: 600px) {
  header { padding-top: 22px; }
  .timeline { min-height: 440px; }
  .event { height: 420px; width: 230px; flex-basis: 230px; }
  .card { height: 175px; }
}

/* Conectores entre las tarjetas y la línea temporal */
.event::after {
    content: "";
    position: absolute;
    left: 22px;
    width: 1px;
    border-left: 1px solid var(--accent);
    opacity: 0.9;
    z-index: 1;
}

.event:nth-child(odd)::after {
    top: 184px;
    height: 27px;
}

.event:nth-child(even)::after {
    top: 229px;
    height: 27px;
}


/* Panel emergente de detalles de misión */
.mission-modal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(3, 8, 20, 0.82);
  backdrop-filter: blur(5px);
}

.mission-modal.open {
  display: flex;
}

.mission-modal-panel {
  position: relative;
  width: min(620px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: #101d31;
  color: #edf4ff;
  border: 1px solid #34516e;
  border-radius: 14px;
  box-shadow: 0 20px 70px rgba(0,0,0,.55);
}

.mission-modal-panel img {
  display: block;
  width: 100%;
  max-height: 300px;
  object-fit: cover;
}

.mission-modal-content {
  padding: 24px;
}

.mission-modal-content h2 {
  margin: 8px 0 12px;
  font-size: 26px;
}

.mission-modal-content p {
  line-height: 1.6;
  color: #c4d3e8;
}

.mission-modal-close {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
  width: 38px;
  height: 38px;
  border: 1px solid #8ca3be;
  border-radius: 50%;
  background: rgba(8, 18, 33, .9);
  color: white;
  font-size: 24px;
  cursor: pointer;
}

.event, .card {
  cursor: pointer;
}

@media (max-width: 600px) {
  .mission-modal {
    padding: 10px;
  }
  .mission-modal-content {
    padding: 18px;
  }
}


/* Ficha de misión mejorada */
.mission-modal-panel {
  width: min(680px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: #0e1a2c;
  color: #edf4ff;
  border: 1px solid #34516e;
  border-radius: 16px;
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
}

.mission-modal-panel img {
  width: 100%;
  max-height: 280px;
  object-fit: cover;
  background: #15253b;
}

.mission-modal-content {
  padding: 25px;
}

.modal-eyebrow {
  color: #45ddc0;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.mission-modal-content h2 {
  font-size: 28px;
  line-height: 1.2;
  margin: 8px 0;
}

.modal-date {
  color: #a9bed8;
  font-size: 13px;
  margin-bottom: 20px;
}

.modal-description {
  color: #c6d5e8;
  font-size: 14px;
  line-height: 1.7;
  margin-top: 20px;
}

.modal-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 20px;
}

.modal-field {
  padding: 12px;
  border: 1px solid #2b405b;
  border-radius: 10px;
  background: #14233a;
  min-width: 0;
}

.modal-field-label {
  display: block;
  color: #8fa8c5;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.modal-field-value {
  display: block;
  font-size: 13px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.modal-result {
  color: #45ddc0;
  font-weight: 700;
}

@media (max-width: 520px) {
  .modal-grid {
    grid-template-columns: 1fr;
  }
  .mission-modal-content {
    padding: 18px;
  }
  .mission-modal-content h2 {
    font-size: 23px;
  }
}


.modal-history-heading {
  margin-top: 22px;
  margin-bottom: -10px;
  color: #45ddc0;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.8px;
}


.card .mission-image {
  display: block;
  width: 100%;
  height: 76px;
  object-fit: cover;
  border-radius: 4px;
  margin: 8px 0;
  border: 1px solid #344966;
}

.card .image-credit {
  font-size: 10px;
  color: #a8bad5;
  margin: -4px 0 6px;
}

</style>
</head>

function render() {
  const inicio = pagina * porPagina;
  const visibles = filtrados.slice(inicio, inicio + porPagina);
  const timeline = document.getElementById("timeline");
  timeline.replaceChildren();

  visibles.forEach(x => {
    const evento = document.createElement("article");
    evento.className = "event";
    const accent = colores[x.resultado] || "#6ad7f2";
    evento.style.setProperty("--accent", accent);

    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = accent;

    const card = document.createElement("div");
    card.className = "card";
    const eventoDatos = visibles.find(v =>
      v.mision === x.mision &&
      v.anio === x.anio &&
      v.destino === x.destino
    );
    card.dataset.nota = x.notas || "";

    const year = document.createElement("div");
    year.className = "year";
    year.textContent = x.anio;

    const title = document.createElement("h2");
    title.textContent = x.mision;

    const imagenInfo = imagenesMisiones[x.mision];
    let imagen = null;
    let creditoImagen = null;

    if (imagenInfo) {
      imagen = document.createElement("img");
      imagen.className = "mission-image";
      imagen.src = imagenInfo.url;
      imagen.alt = "Imagen de " + x.mision;
      imagen.loading = "lazy";

      imagen.onerror = () => {
        imagen.remove();
        if (creditoImagen) creditoImagen.remove();
      };

      creditoImagen = document.createElement("div");
      creditoImagen.className = "image-credit";
      creditoImagen.textContent = imagenInfo.credit;
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = x.destino + " · " + x.pais;

    const detail = document.createElement("div");
    detail.className = "detail";
    detail.textContent = "Tipo de misión: " + x.tipo;

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = x.grupo;

    const result = document.createElement("div");
    result.className = "result";
    result.textContent = "● " + x.resultado;

    card.append(year, title);

	if (imagen) {
		imagen.style.display = "none";
		card.appendChild(imagen);
	}

	if (creditoImagen) {
		creditoImagen.style.display = "none";
		card.appendChild(creditoImagen);
	}

	card.append(meta, detail, tag, result);
    evento.append(dot, card);
    timeline.appendChild(evento);
  });

  document.getElementById("stats").textContent =
    filtrados.length + " misiones · " +
    (filtrados.length ? filtrados[0].anio + "–" + filtrados[filtrados.length-1].anio : "sin resultados");

  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / porPagina));
  document.getElementById("pageLabel").textContent =
    filtrados.length ? `Página ${pagina + 1} de ${totalPaginas}` : "Sin resultados";
  document.getElementById("prev").disabled = pagina === 0;
  document.getElementById("next").disabled = pagina >= totalPaginas - 1;
}

["search", "destino", "resultado", "decada"].forEach(id => {
  document.getElementById(id).addEventListener(
    id === "search" ? "input" : "change", aplicarFiltros
  );
});
document.getElementById("prev").addEventListener("click", () => {
  if (pagina > 0) { pagina--; render(); }
});
document.getElementById("next").addEventListener("click", () => {
  if ((pagina + 1) * porPagina < filtrados.length) { pagina++; render(); }
});
render();
</script>

<div class="modal-history-heading">CONTEXTO HISTÓRICO</div>

      <div id="modalMissionTags"></div>
    </div>
  </div>
</div>


<script>
(function () {
  const modal = document.getElementById("missionModal");
  if (!modal || modal.dataset.ready === "true") return;

  const cerrar = document.getElementById("closeMissionModal");

  function campo(etiqueta, valor, esResultado = false) {
    const caja = document.createElement("div");
    caja.className = "modal-field";

    const nombre = document.createElement("span");
    nombre.className = "modal-field-label";
    nombre.textContent = etiqueta;

    const contenido = document.createElement("span");
    contenido.className = "modal-field-value";
    if (esResultado) contenido.classList.add("modal-result");
    contenido.textContent = valor || "No disponible";

    caja.append(nombre, contenido);
    return caja;
  }

  function abrirMision(tarjeta) {
    window.misionSeleccionadaNota = tarjeta.dataset.nota || "";
    const titulo = tarjeta.querySelector("h2");
    const year = tarjeta.querySelector(".year");
    const meta = tarjeta.querySelector(".meta");
    const detail = tarjeta.querySelector(".detail");
    const tag = tarjeta.querySelector(".tag");
    const result = tarjeta.querySelector(".result");
    const imagen = tarjeta.querySelector("img");

    document.getElementById("modalMissionTitle").textContent =
      titulo?.textContent || "Detalle de la misión";

    const yearBox = document.getElementById("modalMissionYear");
    yearBox.className = "modal-eyebrow";
    yearBox.textContent = "MISIÓN ESPACIAL";

    const metaBox = document.getElementById("modalMissionMeta");
    metaBox.className = "modal-date";
    metaBox.textContent = year?.textContent
      ? "Año de lanzamiento: " + year.textContent
      : "";

    const descripcion = document.getElementById("modalMissionDescription");
    descripcion.className = "modal-description";

    const claveDescripcion =
      (tarjeta.querySelector("h2")?.textContent || "") + "|" +
      (tarjeta.querySelector(".year")?.textContent || "") + "|" +
      (tarjeta.querySelector(".meta")?.textContent.split(" · ")[0] || "");

    const descripcionHistorica =
      typeof descripcionesHistoricas !== "undefined"
        ? descripcionesHistoricas[claveDescripcion]
        : "";

    const nota = (window.misionSeleccionadaNota || "").trim();

    descripcion.textContent = descripcionHistorica || nota ||
      "No hay información histórica adicional disponible para este evento.";

    const tags = document.getElementById("modalMissionTags");
    tags.replaceChildren();

    const grid = document.createElement("div");
    grid.className = "modal-grid";

    grid.append(
      campo("Destino", meta?.textContent.split(" · ")[0]),
      campo("País / agencia", meta?.textContent.split(" · ").slice(1).join(" · ")),
      campo("Tipo de misión", detail?.textContent.replace("Tipo de misión: ", "")),
      campo("Grupo de destino", tag?.textContent),
      campo("Resultado", result?.textContent.replace(/^●\s*/, ""), true)
    );

    tags.appendChild(grid);

    const imagenModal = document.getElementById("modalMissionImage");
    if (imagen && imagen.src) {
      imagenModal.src = imagen.src;
      imagenModal.alt = titulo?.textContent || "";
      imagenModal.style.display = "block";
    } else {
      imagenModal.removeAttribute("src");
      imagenModal.style.display = "none";
    }

    modal.classList.add("open");
  }

  document.addEventListener("click", function (evento) {
    const tarjeta = evento.target.closest(".card");
    if (tarjeta && !evento.target.closest("button, a, select, input")) {
      abrirMision(tarjeta);
    }
  });

  cerrar.addEventListener("click", () => modal.classList.remove("open"));

  modal.addEventListener("click", evento => {
    if (evento.target === modal) modal.classList.remove("open");
  });

  document.addEventListener("keydown", evento => {
    if (evento.key === "Escape") modal.classList.remove("open");
  });

  modal.dataset.ready = "true";
})();
</script>

</body>
</html>
